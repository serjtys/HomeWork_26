{% extends 'catalog/base.html' %}

{% block content %}
<div class="sticky-add-btn">
    <a href="{% url 'product_create' %}" class="btn btn-primary btn-add">
        <i class="bi bi-plus-lg me-2"></i>Добавить товар
    </a>
</div>

<h1 class="text-center my-5">Каталог товаров</h1>

<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for product in products %}
    <div class="col">
        <div class="card h-100">
            {% if product.image %}
            <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}" style="height: 200px; object-fit: cover;">
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text">{{ product.description|truncatechars:100 }}</p>
                <p class="text-muted">{{ product.price }} ₽</p>
            </div>
            <div class="card-footer bg-transparent">
                <div class="d-flex justify-content-between">
                    <a href="{% url 'product_update' product.pk %}" class="btn btn-outline-secondary btn-sm">Изменить</a>
                    <a href="{% url 'product_delete' product.pk %}" class="btn btn-outline-danger btn-sm">Удалить</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
